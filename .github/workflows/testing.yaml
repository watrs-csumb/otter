name: openet-otter-testing

on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main

jobs:
  test-runner:
    name: OTTER Test Runner
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Python Setup
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install UV (hassle-free pip and package management)
      uses: astral-sh/setup-uv@v6.1.0
      with:
        activate-environment: true
    - run: uv add pip

    - name: Install OTTER Dependencies
      run: |
        uv sync --inexact

    - name: Run Pytest with Coverage
      run: |
        uv run pytest
