[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otter"
version = "1.0.0"
requires-python=">=3.12.0"
dependencies = [
    "certifi>=2025.1.31",
    "charset-normalizer>=3.4.1",
    "colorama>=0.4.6",
    "contourpy>=1.3.1",
    "coverage>=7.8.2",
    "cycler>=0.12.1",
    "fonttools>=4.56.0",
    "geopandas>=1.0.1",
    "gitdb>=4.0.12",
    "gitpython>=3.1.44",
    "idna>=3.10",
    "iniconfig>=2.1.0",
    "kiwisolver>=1.4.8",
    "llvmlite>=0.44.0",
    "matplotlib>=3.10.1",
    "mock>=5.2.0",
    "numba>=0.61.0",
    "numpy>=2.1.3",
    "packaging>=24.2",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "pluggy>=1.6.0",
    "pygments>=2.19.1",
    "pyogrio>=0.10.0",
    "pyparsing>=3.2.1",
    "pyproj>=3.7.1",
    "pytest>=8.4.0",
    "pytest-cov>=6.1.1",
    "pytest-dependency>=0.6.0",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2025.1",
    "requests>=2.32.3",
    "shapely>=2.0.7",
    "six>=1.17.0",
    "smmap>=5.0.2",
    "tomli-w>=1.2.0",
    "tqdm>=4.67.1",
    "tzdata>=2025.1",
    "urllib3>=2.3.0",
]

[dependency-groups]
dev = [
    "otter",
]

[tool.uv.sources]
otter = { workspace = true }
